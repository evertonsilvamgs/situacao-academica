<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Situação Acadêmica</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="cartao">
    <h1>Situação Acadêmica</h1>
    <p class="subtitulo">Informe as notas e a frequência para ver a situação final.</p>

    <form id="formulario">
      <div class="linha">
        <label>Nota 1
          <input id="nota1" type="number" min="0" max="10" step="0.1" required>
        </label>
        <label>Nota 2
          <input id="nota2" type="number" min="0" max="10" step="0.1" required>
        </label>
      </div>
      <label>Frequência (%)
        <input id="frequencia" type="number" min="0" max="100" step="1" required>
      </label>
      <button type="submit">Calcular</button>
    </form>

    <section id="resultado" class="resultado" hidden>
      <p>Média: <strong id="media"></strong></p>
      <p>Situação: <strong id="situacao"></strong></p>
    </section>
    <p id="erro" class="erro" hidden></p>
  </main>

  <footer>
    <small id="versao">versão local (sem build)</small>
  </footer>

  <script type="module" src="src/app.js"></script>
</body>
</html>
